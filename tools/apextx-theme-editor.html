<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApexTX Theme Editor</title>
<style>
:root{
  --bg:#0c0d0f; --panel:#141619; --panel2:#181b1f;
  --line:#23262b; --line2:#333840; --text:#f0f0f0; --muted:#9aa3ad; --muted2:#6b7480;
  --blue:#20a0f0; --blue2:#54b7f6; --ink:#061320;
  --orange:#f07020; --orange2:#ffb070; --good:#5fd39a; --bad:#ff8f8f;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(1150px 540px at 82% -10%,rgba(32,160,240,.16),transparent 60%),radial-gradient(760px 420px at 4% 112%,rgba(240,112,32,.06),transparent 55%),var(--bg);color:var(--text);min-height:100vh;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.page{max-width:1280px;margin:0 auto;padding:34px 24px 54px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}
.brand img{height:96px;width:auto;display:block;filter:drop-shadow(0 6px 22px rgba(32,160,240,.22))}
.hgroup{display:flex;align-items:center;gap:12px}
.tag{font-size:11px;font-weight:700;letter-spacing:.09em;background:rgba(32,160,240,.12);border:1px solid rgba(32,160,240,.34);border-radius:999px;padding:7px 12px;color:var(--blue2);white-space:nowrap}
.lang{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--muted);padding:5px 10px;border-radius:999px;line-height:1}
.lang button.on{background:var(--blue);color:#05121d}
h1{font-size:36px;letter-spacing:-1.2px;line-height:1.08;margin:0 0 12px;font-weight:800}
.intro{color:var(--muted);max-width:660px;margin:0 0 20px;font-size:16px}
.tabs{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin:0 0 20px;max-width:560px}
.tabs button{all:unset;flex:1;text-align:center;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted);padding:10px;border-radius:9px}
.tabs button.on{background:linear-gradient(180deg,var(--blue2),var(--blue));color:var(--ink)}
.conn{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px;padding:12px 15px;border:1px solid var(--line2);border-radius:12px;background:rgba(32,160,240,.05);font-size:14px}
.conn b{color:var(--blue2)}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--muted2);flex:none}
.conn .dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
main{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:start}
@media(max-width:1000px){main{grid-template-columns:1fr}.stage{position:static!important}}
@media(max-width:640px){.page{padding:24px 16px 42px}h1{font-size:28px}.brand img{height:64px}.panel{padding:18px}header{flex-wrap:wrap;margin-bottom:22px}}
.panel{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:22px 24px;border-radius:18px;margin:0 0 16px;box-shadow:0 26px 64px -34px rgba(0,0,0,.85)}
.panel::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--blue),var(--orange))}
.panel h2{font-size:15px;margin:0 0 4px;letter-spacing:.02em}
.panel p.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel h3{font-size:11px;letter-spacing:.1em;color:var(--muted2);margin:14px 0 7px;font-weight:700}
.view{display:none}.view.on{display:block}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;border-radius:999px;padding:3px 8px;margin-left:8px;vertical-align:2px}
.badge.base{background:rgba(95,211,154,.12);border:1px solid rgba(95,211,154,.4);color:var(--good)}
.badge.ext{background:rgba(240,112,32,.1);border:1px solid rgba(240,112,32,.4);color:var(--orange2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 14px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],select{background:#0f1113;border:1px solid var(--line2);border-radius:9px;color:var(--text);font:inherit;padding:8px 10px}
.color{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.015)}
.color input[type=color]{width:34px;height:28px;border:0;padding:0;background:none;cursor:pointer;flex:none}
.color div{display:flex;flex-direction:column;min-width:0}
.color b{font-size:12.5px;font-weight:600}
.color span{font-size:11.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.color code{font-size:11px;color:var(--muted);margin-left:auto}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button,.btn{all:unset;cursor:pointer;font-weight:700;font-size:13px;padding:9px 13px;border-radius:10px;border:1px solid var(--line2);background:#1b1e23;color:var(--text);display:inline-flex;align-items:center;gap:8px}
.presets button i{width:14px;height:14px;border-radius:4px;display:inline-block}
.presets button i+i{margin-left:-6px}
.btn.primary{background:linear-gradient(180deg,var(--blue2),var(--blue));color:var(--ink);border-color:transparent;box-shadow:0 12px 28px -12px rgba(32,160,240,.7)}
.btn:hover,.presets button:hover{border-color:var(--blue)}
.btn:disabled,.btn.off{opacity:.45;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
input[type=range]{width:100%;accent-color:var(--blue)}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--blue)}
.seg{display:flex;gap:4px;background:#0f1113;border:1px solid var(--line2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 11px;border-radius:8px}
.seg button.on{background:var(--blue);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tiles button{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#0f1113;display:flex;flex-direction:column}
.tiles button.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(32,160,240,.35)}
.tiles canvas{width:100%;height:auto;aspect-ratio:2/3;display:block}
.tiles span{font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 7px;text-align:center}
.tiles button.on span{color:var(--blue2)}
.drop{display:block;border:1.5px dashed var(--line2);border-radius:12px;padding:12px;cursor:pointer;color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.drop:hover{border-color:var(--blue)}
.warn{background:rgba(240,112,32,.09);border:1px solid rgba(240,112,32,.34);border-radius:10px;padding:9px 12px;font-size:12.5px;color:var(--orange2);margin-top:10px;display:none}
.screens{display:flex;flex-wrap:wrap;gap:6px}
.screens button{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;color:var(--muted);background:#0f1113}
.screens button.on{border-color:var(--blue);color:var(--blue2);box-shadow:0 0 0 2px rgba(32,160,240,.3)}
.layouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.layouts button{all:unset;cursor:pointer;border:1px solid var(--line2);border-radius:10px;background:#0f1113;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.layouts button.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(32,160,240,.35)}
.layouts canvas{width:48px;height:72px}
.layouts span{font-size:11px;font-weight:700;color:var(--muted)}
.zone{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 8px;background:rgba(255,255,255,.012)}
.zone.on{border-color:var(--blue);background:rgba(32,160,240,.06)}
.zone .head{display:flex;gap:10px;align-items:center}
.zone .head b{font-size:12px;color:var(--muted2);min-width:58px}
.zone select{flex:1}
.zone .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 12px;margin-top:8px}
.zone .note{font-size:12px;color:var(--muted2);margin-top:6px}
.checks{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.checks label{display:flex;gap:7px;align-items:center;cursor:pointer}
.stage{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.radio{padding:16px;border-radius:30px;background:linear-gradient(160deg,#2a2d33,#121316);box-shadow:0 30px 70px -30px #000,inset 0 1px 0 rgba(255,255,255,.08)}
#screen{display:block;border-radius:6px;background:#000;cursor:pointer}
.note{color:var(--muted2);font-size:12px;max-width:420px;text-align:center;margin:0}
pre{background:#0f1113;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;max-height:240px;overflow:auto;color:var(--muted);white-space:pre-wrap}
.status{font-size:13px;color:var(--good);min-height:18px;margin:10px 0 0}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.busy.on{display:flex}
.busy .box{position:relative;width:min(460px,100%);border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));padding:24px;border-radius:18px;box-shadow:0 26px 64px -20px rgba(0,0,0,.9)}
.busy .box::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:18px 18px 0 0;background:linear-gradient(90deg,var(--blue),var(--orange))}
.busy b{display:block;font-size:17px;margin:0 0 4px}
.busy progress{appearance:none;-webkit-appearance:none;width:100%;height:10px;margin:16px 0 11px;display:block;border:0;background:transparent}
.busy progress::-webkit-progress-bar{background:#23272d;border-radius:999px}
.busy progress::-webkit-progress-value{background:linear-gradient(90deg,var(--blue),var(--blue2));border-radius:999px;transition:width .3s}
.busy p{margin:0;font-size:14px;color:var(--muted);min-height:20px}
.busy .unplug{display:none;margin-top:14px;padding:12px 14px;border:1px solid rgba(95,211,154,.4);background:rgba(95,211,154,.08);border-radius:11px;color:var(--good);font-size:14px;font-weight:600}
.busy .btn{margin-top:16px;display:none}
footer{font-size:12px;color:var(--muted2);margin:26px 2px 0;border-top:1px solid var(--line);padding-top:18px}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="brand"><img id="logo" src="__LOGO_DATA__" alt="ApexTX"></div>
  <div class="hgroup">
    <div class="lang"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="de">DE</button></div>
    <div class="tag">NOBLE&nbsp;NB4 / NB4+</div>
  </div>
</header>

<h1 data-t="h1"></h1>
<p class="intro" data-t="subtitle"></p>

<div class="conn" id="conn">
  <span class="dot" id="connDot"></span>
  <span id="connText"></span>
  <select id="target" style="display:none;min-width:200px"></select>
  <button class="btn" id="refresh" data-t="refresh"></button>
</div>

<div class="tabs" id="tabs">
  <button data-view="theme" class="on" data-t="tabTheme"></button>
  <button data-view="screens" data-t="tabScreens"></button>
  <button data-view="radio" data-t="tabRadio"></button>
</div>
<div class="warn" id="unsavedWarn" style="margin:-8px 0 18px"></div>

<main>
<div>
  <!-- ====================================================== THEME -->
  <div class="view on" id="view-theme">
    <section class="panel">
      <h2 data-t="secTheme"></h2>
      <p class="hint" data-t="hintTheme"></p>
      <div class="grid">
        <label class="f"><span data-t="name"></span><input type="text" id="tName" maxlength="26"></label>
        <label class="f"><span data-t="author"></span><input type="text" id="tAuthor" maxlength="32"></label>
        <label class="f" style="grid-column:span 2"><span data-t="info"></span><input type="text" id="tInfo" maxlength="64"></label>
      </div>
      <div class="warn" id="reservedWarn"></div>
      <div id="presets"></div>
    </section>

    <section class="panel">
      <h2><span data-t="secPalette"></span><span class="badge base" data-t="badgeBase"></span></h2>
      <p class="hint" data-t="hintPalette"></p>
      <div class="grid" id="palette"></div>
      <div class="warn" id="contrastWarn"></div>
    </section>

    <section class="panel">
      <h2><span data-t="secInstr"></span><span class="badge ext" data-t="badgeExt"></span></h2>
      <p class="hint" data-t="hintInstr"></p>
      <div class="grid" id="instrColors"></div>
    </section>

    <section class="panel">
      <h2><span data-t="secBg"></span><span class="badge ext" data-t="badgeExt"></span></h2>
      <p class="hint" data-t="hintBg"></p>
      <div id="bgTiles"></div>
      <label class="drop" id="drop"><span data-t="dropBg"></span><input type="file" id="bgFile" accept="image/*" hidden></label>
      <div class="grid" style="margin-top:12px">
        <label class="f"><span><span data-t="bgDim"></span> <b id="vDim"></b></span><input type="range" id="bgDim" min="0" max="90"></label>
        <label class="f"><span><span data-t="cardOpacity"></span> <b id="vOpa"></b></span><input type="range" id="cardOpa" min="30" max="100"></label>
        <div class="f"><span data-t="bgFit"></span><div class="seg" id="segFit"></div></div>
      </div>
    </section>

    <section class="panel">
      <h2 data-t="secExport"></h2>
      <p class="hint" data-t="hintExport"></p>
      <div class="row radioOnly" style="margin-bottom:10px">
        <select id="radioThemes" style="flex:1;min-width:200px"></select>
        <button class="btn" id="loadRadio" data-t="loadRadio"></button>
        <button class="btn primary" id="saveRadio" data-t="saveRadio"></button>
        <label class="checks" style="flex-basis:100%"><label><input type="checkbox" id="activateTheme" checked><span data-t="activateTheme"></span></label></label>
      </div>
      <div class="row">
        <button class="btn" id="dlZip" data-t="dlZip"></button>
        <button class="btn" id="loadTheme" data-t="loadTheme"></button>
        <input type="file" id="ymlFile" accept=".yml,.yaml" hidden>
      </div>
      <p class="status" id="themeStatus"></p>
      <pre id="yml"></pre>
    </section>
  </div>

  <!-- ==================================================== SCREENS -->
  <div class="view" id="view-screens">
    <section class="panel">
      <h2 data-t="secCar"></h2>
      <p class="hint" data-t="hintCar"></p>
      <div class="row">
        <select id="carSelect" style="flex:1;min-width:220px"></select>
        <button class="btn" id="carReload" data-t="reload"></button>
        <button class="btn primary" id="carSave" data-t="saveScreens"></button>
      </div>
      <div class="warn" id="carWarn"></div>
      <p class="status" id="carStatus"></p>
    </section>

    <section class="panel">
      <h2 data-t="secScreens"></h2>
      <p class="hint" data-t="hintScreens"></p>
      <div class="screens" id="screenList"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="addScreen" data-t="addScreen"></button>
        <button class="btn" id="delScreen" data-t="delScreen"></button>
        <button class="btn" id="restoreHome" data-t="restoreHome"></button>
      </div>
    </section>

    <section class="panel">
      <h2 data-t="secLayout"></h2>
      <p class="hint" data-t="hintLayout"></p>
      <div class="layouts" id="layoutList"></div>
      <h3 data-t="layoutOptions"></h3>
      <div class="checks" id="layoutOpts"></div>
    </section>

    <section class="panel">
      <h2 data-t="secZones"></h2>
      <p class="hint" data-t="hintZones"></p>
      <div id="zoneList"></div>
    </section>
  </div>

  <!-- ====================================================== RADIO -->
  <div class="view" id="view-radio">
    <section class="panel">
      <h2 data-t="secAppearance"></h2>
      <p class="hint" data-t="hintAppearance"></p>
      <div class="grid">
        <label class="f"><span data-t="selTheme"></span><select id="rTheme"></select></label>
        <label class="f"><span data-t="accent"></span><select id="rAccent"></select></label>
        <label class="f"><span data-t="orientation"></span><select id="rOrient"></select></label>
      </div>
    </section>
    <section class="panel">
      <h2 data-t="secLights"></h2>
      <p class="hint" data-t="hintLights"></p>
      <div class="grid">
        <label class="f"><span data-t="ledMode"></span><select id="rLedMode"></select></label>
        <label class="f"><span data-t="ledColor"></span><select id="rLedColor"></select></label>
      </div>
    </section>
    <section class="panel">
      <div class="row">
        <button class="btn" id="radioReload" data-t="reload"></button>
        <button class="btn primary" id="radioSave" data-t="saveSettings"></button>
      </div>
      <p class="status" id="radioStatus"></p>
    </section>
  </div>
</div>

<div class="stage">
  <div class="seg" id="segOrient"></div>
  <div class="radio"><canvas id="screen"></canvas></div>
  <div class="seg" id="segSim"></div>
  <p class="note" id="fwBadge" style="margin:0;text-align:center;max-width:420px"></p>
  <p class="status" id="previewStatus" style="margin:0;text-align:center;max-width:420px"></p>
  <p class="note" data-t="previewNote"></p>
</div>
</main>
<footer data-t="footer"></footer>
<div class="busy" id="busy"><div class="box">
  <b id="busyTitle"></b>
  <progress id="busyBar" max="100" value="0"></progress>
  <p id="busyText"></p>
  <div class="unplug" id="busyUnplug" data-t="unplugNow"></div>
  <button class="btn primary" id="busyOk" data-t="ok"></button>
</div></div>
</div>

<script>
'use strict';

// ---------------------------------------------------------------------------
// Texts
// ---------------------------------------------------------------------------
const T = {

    optOnRadio: 'More settings of this widget on the transmitter: long press the tile.',
    secAppearance: 'Appearance', hintAppearance: 'Palette or theme, accent colour and orientation of the whole transmitter.',
    selTheme: 'Palette / theme', accent: 'Accent', orientation: 'Orientation',
    secLights: 'Lights', hintLights: 'The LED strip of the transmitter. Charging temporarily overrides the colour.',
    ledMode: 'Mode', ledColor: 'Colour', saveSettings: 'Save settings',
    accents: ['Palette accent', 'Blue', 'Orange', 'Green', 'Red', 'Yellow', 'Cyan', 'Magenta', 'White'],

function applyPreset(group, name) {
  const p = PRESETS[group][name];

    bgPattern: p.look.bg || 'none', cardOpacity: p.look.opa || 100, bgDim: p.look.bg ? 20 : 30,

// ---------------------------------------------------------------------------
// Colour helpers
// ---------------------------------------------------------------------------
const col = k => '#' + (state.colors[k] || state.nb4[k] || '000000');
const C = k => state.colors[k] || state.nb4[k];
function rgb(hex) { const n = parseInt(hex, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function alpha(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function lum(hex) {
  return rgb(hex).map(v => { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); })
    .reduce((a, v, i) => a + v * [.2126, .7152, .0722][i], 0);
}
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

const PATTERNS = {
  gradient(g, W, H) {

  hex(g, W, H) {
    const r = 18, hh = r * Math.sqrt(3);

  city(g, W, H) {

    // three skyline layers, back to front
    for (const [depth, shade, win] of [[.55, .25, .25], [.75, .55, .45], [1, .9, .85]]) {

        g.fillRect(x, top, bw, bh);

          if (R() < .38) { g.fillStyle = alpha(R() < .5 ? C('EDIT') : C('WARNING'), win * (.4 + R() * .6)); g.fillRect(wx, wy, 3, 4); }
        if (R() < .25) { g.fillStyle = '#' + C('FOCUS'); g.fillRect(x + bw / 2 - 1, top - 10, 2, 10); }

    g.fillStyle = gr; g.fillRect(0, hz, W, H - hz);
    for (let i = 0; i < 60; i++) { g.fillStyle = alpha(R() < .5 ? C('EDIT') : C('FOCUS'), R() * .35); g.fillRect(R() * W, hz + R() * (H - hz), 2, 6 + R() * 30); }
    g.strokeStyle = alpha(C('PRIMARY1'), .5); g.setLineDash([16, 14]); g.lineWidth = 3;

  },
  touge(g, W, H) {
    const R = rng(29);
    let gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, alpha(C('SECONDARY3'), 1)); gr.addColorStop(.5, alpha(C('FOCUS'), .35)); gr.addColorStop(1, alpha(C('SECONDARY3'), 1));
    g.fillStyle = gr; g.fillRect(0, 0, W, H);

    for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${R() * .5})`; g.fillRect(R() * W, R() * H * .35, 1.2, 1.2); }
    // mountain ridges

      g.beginPath(); g.moveTo(0, H);

  bokeh(g, W, H) {

  },
  circuit(g, W, H) {
    const R = rng(53), step = 16;
    g.lineWidth = 1.6; g.lineCap = 'round';
    for (let i = 0; i < 70; i++) {
      let x = Math.round(R() * W / step) * step, y = Math.round(R() * H / step) * step;
      const c = R() < .7 ? C('EDIT') : C('FOCUS'), a = .15 + R() * .4;

    for (let i = 0; i < 8; i++) {
      const x = R() * (W - 50), y = R() * (H - 30);
      g.fillStyle = alpha(C('SECONDARY2'), .9); g.fillRect(x, y, 40, 22);
      g.strokeStyle = alpha(C('FOCUS'), .4); g.strokeRect(x + .5, y + .5, 40, 22);
      for (let p = 0; p < 5; p++) { g.fillStyle = alpha(C('PRIMARY3'), .6); g.fillRect(x + 4 + p * 8, y - 3, 3, 3); g.fillRect(x + 4 + p * 8, y + 22, 3, 3); }

  },
  smoke(g, W, H) {
    const R = rng(7);
    for (let i = 0; i < 34; i++) {
      const x = R() * W, y = H * (.25 + R() * .8), r = 40 + R() * 120;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, `rgba(235,235,240,${.06 + R() * .12})`); gr.addColorStop(1, 'rgba(235,235,240,0)');

  neon(g, W, H) {
    const hz = H * .42;

    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, alpha(C('FOCUS'), .45));

  speed(g, W, H) {

function paintBackground(g, W, H, pattern = state.bgPattern) {
  g.fillStyle = col('SECONDARY3'); g.fillRect(0, 0, W, H);
  if (pattern === 'none') return;
  if (pattern === 'image') {
    const img = state.bgImage;
    if (!img) return;

let simT = 0, lapStart = performance.now();
const smooth = {steer: 0, thr: 0, ch3: 0, ch4: 0};
function simulate(dt) {
  simT += dt;
  const s = simT / 1000;
  let steer = 0, thr = 0;
  if (state.sim === 'drift') {
    const phase = Math.sin(s * .9);
    steer = -phase * 78 + Math.sin(s * 6.3) * 9;
    thr = 72 + Math.sin(s * 2.1) * 22 - (Math.abs(phase) < .15 ? 55 : 0);
  } else if (state.sim === 'race') {
    const lap = s % 6;
    thr = lap < 3.2 ? 100 : lap < 3.9 ? -85 : lap < 4.6 ? 15 : 80;
    steer = lap > 3.6 && lap < 5.2 ? Math.sin((lap - 3.6) / 1.6 * Math.PI) * 55 : Math.sin(s * 3) * 4;
  } else if (state.sim === 'crawl') {
    steer = Math.sin(s * .45) * 92;
    thr = Math.max(-20, 14 + Math.sin(s * .8) * 14 + (Math.sin(s * .23) > .8 ? -30 : 0));
  }
  const k = Math.min(1, dt / 120);
  smooth.steer += (steer - smooth.steer) * k;
  smooth.thr += (thr - smooth.thr) * k;
  smooth.ch3 += ((Math.sin(s * .3) > 0 ? 100 : -100) - smooth.ch3) * k * .5;
  smooth.ch4 += (Math.sin(s * .55) * 100 - smooth.ch4) * k;
  const c = n => Math.round(Math.max(-100, Math.min(100, n)));
  return {steer: c(smooth.steer), thr: c(smooth.thr), ch3: c(smooth.ch3), ch4: c(smooth.ch4)};
}

// ---------------------------------------------------------------------------
// Firmware preview: the ApexTX firmware, built for the PC, draws the screen
// from the same files the transmitter would get (tools/nb4_preview.py).
// ---------------------------------------------------------------------------
const FW_THEME = 'Editor Preview', FW_FOLDER = 'EditorPreview';
const fw = {on: false, canvas: document.createElement('canvas'), w: 0, h: 0, seq: 0, key: '', due: 0, busy: false, sent: '', error: ''};
function fwShown(Wd, Hd) { return fw.on && fw.w === Wd && fw.h === Hd && !fw.error; }
function fwKey() {
  return JSON.stringify([state.colors, state.nb4, state.cardOpacity, state.bgPattern, state.bgFit, state.bgDim,
    state.bgImage ? (state.bgImage.src || '').length : 0, state.landscape, car && car.screenData, car && car.file,
    selScreen, radioRoot(), radio && radio.settings.nb4Accent]);
}
async function fwStage() {
  fw.busy = true;
  const key = fwKey();
  try {
    // The preview theme gets its own name: the firmware refuses files that
    // reuse a built-in theme's name, and the edited name may be one.
    const yml = themeYml().replace(/^  name: .*$/m, '  name: ' + FW_THEME);
    const dir = 'THEMES/' + FW_FOLDER + '/';
    const files = [{name: dir + 'theme.yml', data: bytesB64(new TextEncoder().encode(yml))}];
    const png = await backgroundPng();
    if (png) files.push({name: dir + 'background.png', data: bytesB64(png)});
    const wide = await backgroundPng(480, 320);
    if (wide) files.push({name: dir + 'background_480x320.png', data: bytesB64(wide)});
    const body = {files, selectedTheme: FW_THEME, nb4Orientation: state.landscape ? 1 : 0,
      nb4Accent: radio ? +(radio.settings.nb4Accent || 0) : 0, view: screenKeys().indexOf(selScreen)};
    if (car) body.screenData = car.screenData;
    if (car && car.file && radioRoot()) { body.model = car.file; body.target = radioRoot(); }
    await api('/api/preview', body);
    fw.key = key; fw.sent = ''; fw.error = '';
    $('fwBadge').textContent = t('fwLive');
    document.querySelector('[data-t="previewNote"]').style.display = 'none';
  } catch (e) {
    fw.key = key; fw.error = e.message;
    $('fwBadge').textContent = t('fwFailed') + e.message;
    document.querySelector('[data-t="previewNote"]').style.display = '';
  }
  fw.busy = false;
}
async function fwFrames() {
  for (;;) {
    try {
      const r = await fetch('/api/preview/frame?after=' + fw.seq, {headers: {'X-ApexTX-Token': TOKEN}});
      if (r.status === 200) {
        const [seq, w, h, shown] = r.headers.get('X-Frame').split(' ').map(Number);
        const px = new Uint16Array(await r.arrayBuffer());
        if (fw.canvas.width !== w || fw.canvas.height !== h) { fw.canvas.width = w; fw.canvas.height = h; }
        const g = fw.canvas.getContext('2d'), img = g.createImageData(w, h), d = img.data;
        for (let i = 0, j = 0; i < px.length; i++, j += 4) {
          const v = px[i];
          d[j] = (v >> 11) * 255 / 31; d[j + 1] = ((v >> 5) & 63) * 255 / 63; d[j + 2] = (v & 31) * 255 / 31; d[j + 3] = 255;
        }
        g.putImageData(img, 0, 0);
        fw.seq = seq; fw.w = w; fw.h = h; fw.view = shown;
        fw.zones = (r.headers.get('X-Zones') || '').split(';').filter(Boolean).map(z => z.split(',').map(Number));
        continue;
      }
    } catch (e) { /* editor closing */ }
    await new Promise(res => setTimeout(res, 30));
  }
}
function fwTick() {
  if (!fw.on) return;
  const key = fwKey(), now = performance.now();
  if (key !== fw.key && !fw.busy) {
    if (!fw.due) fw.due = now + 350;
    else if (now >= fw.due) { fw.due = 0; fwStage(); }
  }
  const inputs = JSON.stringify({steer: Math.round(values.steer), thr: Math.round(values.thr), ch3: Math.round(values.ch3), ch4: Math.round(values.ch4)});
  if (inputs !== fw.sent && now - (fw.inputAt || 0) > 50) {
    fw.sent = inputs; fw.inputAt = now;
    api('/api/preview/input', JSON.parse(inputs)).catch(() => {});
  }
}
async function fwInit() {
  try {
    const s = await (await fetch('/api/preview/status', {headers: {'X-ApexTX-Token': TOKEN}})).json();
    if (!s.available) return;
    fw.on = true;
    $('fwBadge').textContent = t('fwStarting');
    fwFrames();
    setInterval(fwTick, 50);
  } catch (e) { /* approximation only */ }
}

function loop(now) {

function segment(el, items, get, set) {

function folderName() { return (state.name || 'MyTheme').replace(/[^A-Za-z0-9]+/g, '').slice(0, 26) || 'MyTheme'; }

function themeYml() {
  const L = ['# SPDX-License-Identifier: GPL-2.0-only', '---', 'summary:',
    '  name: ' + yamlStr(state.name || 'My Theme'), '  author: ' + yamlStr(state.author || '-'), '  info: ' + yamlStr(state.info || '-'), 'colors:'];
  for (const [k] of COLOR_KEYS) L.push(`  ${k}: 0x${state.colors[k]}`);
  // Optional ApexTX extension; firmware without support skips unknown sections.
  L.push('nb4:');
  for (const [k] of INSTR_KEYS) L.push(`  ${k}: 0x${state.nb4[k]}`);

function parseYml(src) {
  let section = '';

  for (const raw of src.split(/\r?\n/)) {
    const line = raw.replace(/\s+#.*$/, '');
    if (!line.trim() || line.trim().startsWith('#') || line.startsWith('---')) continue;
    const m = line.match(/^(\s*)([A-Za-z0-9_]+):\s*(.*)$/);
    if (!m) continue;

    const val = val0.trim().replace(/^"(.*)"$/, '$1'), hex = val.match(/^0x([0-9a-fA-F]{6})$/);
    if (section === 'summary' && ['name', 'author', 'info'].includes(key)) state[key] = val === '-' ? '' : val;

      else if (key === 'CARD_OPACITY') state.cardOpacity = Math.max(30, Math.min(100, +val || 100));
      else if (key === 'BACKGROUND' && (PATTERNS[val] || val === 'image')) state.bgPattern = val;

    }
    // Pending screen changes go along, so one save brings everything over.
    if (carDirty && car.file && car.editable && radioRoot() && target() === radioRoot()) {
      busyStep(90, t('stepScreens'));
      const res2 = await api('/api/model', {target: radioRoot(), file: car.file, hash: car.hash, screenData: car.screenData});
      car.hash = res2.hash; carDirty = false; $('carSave').classList.add('off'); showUnsaved();
      msg += '  ·  ' + t('screensSaved').replace('%s', car.name);
    }
    status('themeStatus', msg);
    busyDone(msg);
    loadThemeList().catch(() => {});
  } catch (e) { status('themeStatus', e.message, true); busyFail(e.message); }
};
$('dlZip').onclick = async () => {
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zip(await themeFiles()));
    a.download = folderName() + '.zip'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  } catch (e) { status('themeStatus', e.message, true); }
};
$('loadTheme').onclick = () => $('ymlFile').click();
$('ymlFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; parseYml(await f.text()); refreshAll(); status('themeStatus', t('loaded')); };

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
function showView(v) {
  state.view = v;
  document.querySelectorAll('.view').forEach(e => e.classList.toggle('on', e.id === 'view-' + v));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  try { localStorage.setItem('apextxThemeView', v); } catch (e) {}
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => showView(b.dataset.view));
function buildCommon() {
  segment($('segOrient'), [['p', t('portrait')], ['l', t('landscape')]], () => state.landscape ? 'l' : 'p', v => setOrientation(v === 'l'));
  segment($('segSim'), [['drift', t('simDrift')], ['race', t('simRace')], ['crawl', t('simCrawl')], ['idle', t('simIdle')]], () => state.sim, v => state.sim = v);
}
function refreshAll() { bgCache = null; buildThemeControls(); syncThemeInputs(); buildCommon(); buildScreens(); }
function setLang(l) {
  lang = l;
  document.documentElement.lang = l;
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = t(e.dataset.t));
  document.querySelectorAll('.lang button').forEach(b => b.className = b.dataset.lang === l ? 'on' : '');
  try { localStorage.setItem('apextxThemeLang', l); } catch (e) {}
  if (car && !car.file) car.name = t('demoCar');
  refreshAll();
  loadTargets().catch(() => {});
}
$('tName').oninput = e => { state.name = e.target.value; };
$('tAuthor').oninput = e => { state.author = e.target.value; };
$('tInfo').oninput = e => { state.info = e.target.value; };
$('bgDim').oninput = e => { state.bgDim = +e.target.value; syncThemeInputs(); bgCache = null; drawTiles(); };
$('cardOpa').oninput = e => { state.cardOpacity = +e.target.value; syncThemeInputs(); drawTiles(); };
function setImage(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => { state.bgImage = img; state.bgPattern = 'image'; bgCache = null; drawTiles(); res(); };
    img.src = src;
  });
}
function loadImage(file) { if (file && file.type.startsWith('image/')) setImage(URL.createObjectURL(file)); }
$('bgFile').onchange = e => loadImage(e.target.files[0]);
$('drop').ondragover = e => e.preventDefault();
$('drop').ondrop = e => { e.preventDefault(); loadImage(e.dataTransfer.files[0]); };
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => setLang(b.dataset.lang));

// Opened directly from the tools folder, the placeholders are not filled in.
if ($('logo').getAttribute('src').startsWith('__')) $('logo').src = 'apextx-updater-logo.png';

(async () => {
  if (!CATALOG) { try { CATALOG = await (await fetch('apextx-theme-editor-catalog.json')).json(); } catch (e) {} }
  let saved = (navigator.language || 'en').slice(0, 2);
  try { saved = localStorage.getItem('apextxThemeLang') || saved; } catch (e) {}
  if (!T[saved]) saved = 'en';
  const first = PRESETS.grpDrift['Drift Neon'];
  Object.assign(state, {colors: {...first.colors}, nb4: {...first.nb4}, info: first.info, name: 'Drift Neon', bgPattern: 'neon', cardOpacity: 82});
  car = demoCar();
  if (!inApp) document.querySelectorAll('.radioOnly').forEach(e => e.style.display = 'none');
  let view = 'theme';
  try { view = localStorage.getItem('apextxThemeView') || view; } catch (e) {}
  // #theme, #screens or #radio opens that tab directly.
  if (['#theme', '#screens', '#radio'].includes(location.hash)) view = location.hash.slice(1);
  showView(view);
  setLang(saved);
  if (inApp) fwInit();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
