version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
# Vendored submodules are deliberately not tracked here. Their correct revision
# is the one upstream EdgeTX pins, so they move when an EdgeTX release is
# integrated, not when the submodule's own repository moves ahead.
