# SPDX-License-Identifier: GPL-2.0-only
name: ApexTX CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request from a fork gets a read-only token and nothing else.
permissions:
  contents: read

concurrency:
  group: apextx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and test ApexTX for ${{ matrix.radio }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.12
    strategy:
      fail-fast: false
      matrix:
        include:
          - radio: Noble NB4
            model: nb4
            variant: standard
            options: -DNB4_PLUS_HW=OFF -DNB4_LED_DIAGNOSTIC=OFF
          - radio: Noble NB4+
            model: nb4plus
            variant: standard
            options: -DNB4_PLUS_HW=ON -DNB4_LED_DIAGNOSTIC=OFF
          - radio: Noble NB4 (LED diagnostic)
            model: nb4
            variant: led-diagnostic
            options: -DNB4_PLUS_HW=OFF -DNB4_LED_DIAGNOSTIC=ON
          - radio: Noble NB4+ (LED diagnostic)
            model: nb4plus
            variant: led-diagnostic
            options: -DNB4_PLUS_HW=ON -DNB4_LED_DIAGNOSTIC=ON
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          # Build the precise PR head named on the downloadable artifact.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install desktop signature verification
        run: uv pip install --python "$(command -v python3)" -r tools/requirements-updater.txt

      - name: Validate NB4 tools and RF profile
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/nb4-generate-qualified-profile.py \
            --check docs/nb4/rf/qualification.json
          python3 tools/nb4-rf-generate.py --check

      - name: Configure firmware and native tests
        run: |
          cmake -S . -B build/nb4-ci \
            -DPCB=PL18 -DPCBREV=NB4 ${{ matrix.options }} \
            -DNB4_RF_PROFILE=RECOVERED_USART6 \
            -DAPEXTX_PUBLIC_RELEASE=OFF \
            -DTRANSLATIONS=EN \
            -DDISABLE_COMPANION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DWARNINGS_AS_ERRORS=NO \
            -Wno-dev

      - name: Build firmware
        run: |
          cmake --build build/nb4-ci --target arm-none-eabi-configure -j4
          cmake --build build/nb4-ci/arm-none-eabi --target firmware-size nb4-backup-agent nb4-nor-restore-agent -j4
          python3 tools/nb4-verify-backup-agent.py \
            --elf build/nb4-ci/arm-none-eabi/radio/src/bootloader/nb4-backup-agent.elf \
            --bin build/nb4-ci/arm-none-eabi/nb4-backup-agent.bin \
            --nm arm-none-eabi-nm \
            --report build/nb4-ci/arm-none-eabi/backup-agent.json
          python3 tools/nb4-verify-backup-agent.py --restore \
            --elf build/nb4-ci/arm-none-eabi/radio/src/bootloader/nb4-nor-restore-agent.elf \
            --bin build/nb4-ci/arm-none-eabi/nb4-nor-restore-agent.bin \
            --nm arm-none-eabi-nm \
            --report build/nb4-ci/arm-none-eabi/nor-restore-agent.json

      - name: Verify ROM automatic-start machine code
        run: |
          uv pip install --target build/rom-start-test-deps unicorn==2.1.4
          PYTHONPATH=build/rom-start-test-deps python3 tools/nb4-verify-rom-start.py \
            build/nb4-ci/arm-none-eabi/firmware.bin

      - name: Build and run native tests
        run: |
          cmake --build build/nb4-ci --target native-configure -j4
          cmake --build build/nb4-ci/native --target tests-radio -j4

      - name: Package and validate the exact hardware image
        env:
          CI_MODEL: ${{ matrix.model }}
          CI_VARIANT: ${{ matrix.variant }}
        run: |
          python3 tools/apextx-updater.py build/nb4-ci/arm-none-eabi/firmware.bin --check
          python3 tools/nb4-package.py \
            --build build/nb4-ci/arm-none-eabi \
            --output dist/firmware --model "$CI_MODEL"
          cp docs/nb4/LED_DIAGNOSTIC.md dist/firmware/LED_DIAGNOSTIC.md
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          out = pathlib.Path('dist/firmware')
          image = out / 'firmware.bin'
          info = {
              'sourceCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'model': os.environ['CI_MODEL'],
              'variant': os.environ['CI_VARIANT'],
              'bytes': image.stat().st_size,
              'sha256': hashlib.sha256(image.read_bytes()).hexdigest(),
              'diagnosticVersion': 'D1' if os.environ['CI_VARIANT'] == 'led-diagnostic' else None,
              'hardwareValidated': False,
          }
          (out / 'BUILD.json').write_text(json.dumps(info, indent=2) + '\n')
          (out / 'SHA256SUMS').write_text(info['sha256'] + '  firmware.bin\n')
          PY

      - name: Upload verified firmware
        uses: actions/upload-artifact@v7
        with:
          name: apextx-${{ matrix.model }}-${{ matrix.variant }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/firmware/
          if-no-files-found: error
          retention-days: 30

  audio:
    name: Build and verify the four audio packs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prepare the pinned audio source
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          git clone --depth 1 --branch v2.12.3 --filter=blob:none --sparse \
            https://github.com/EdgeTX/edgetx-sdcard-sounds.git \
            build/edgetx-sdcard-sounds
          git -C build/edgetx-sdcard-sounds sparse-checkout set \
            SOUNDS/en SOUNDS/es SOUNDS/de SOUNDS/cn voices

      - name: Build and verify the audio packs
        run: |
          python3 tools/nb4-audio-packs.py \
            --source build/edgetx-sdcard-sounds --output dist \
            --release "$(cat APEXTX_VERSION)"
          python3 - <<'PY'
          import importlib.util, pathlib, tempfile
          spec = importlib.util.spec_from_file_location('installer', 'tools/nb4-install-audio.py')
          import sys
          installer = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = installer
          spec.loader.exec_module(installer)
          for archive in sorted(pathlib.Path('dist').glob('apextx-audio-*.zip')):
              with tempfile.TemporaryDirectory() as directory:
                  root = pathlib.Path(directory)
                  installer.safe_extract(archive, root)
                  manifest, _ = installer.read_and_verify_pack(root)
                  print(archive.name, manifest['installedFiles'], 'verified files')
          PY

      - name: Upload the audio packs
        uses: actions/upload-artifact@v7
        with:
          name: apextx-audio-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/apextx-audio-*.zip
          if-no-files-found: error

  flashers:
    name: Build the desktop flashers
    uses: ./.github/workflows/flasher.yml
