# SPDX-License-Identifier: GPL-2.0-only
name: ApexTX Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build the ApexTX package for the ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.12
    strategy:
      fail-fast: true
      matrix:
        # One package per radio, named after it, so each owner downloads the
        # one that matches. An image for the wrong radio is refused by the
        # updater and by the bootloader, but the name should get it right
        # first. NB4+ remains an experimental alpha target, but its update and
        # recovery paths have been exercised successfully on real hardware.
        include:
          - model: nb4
            name: Noble NB4
            options: ''
          - model: nb4plus
            name: Noble NB4+
            options: -DNB4_PLUS_HW=ON
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate version and the RF descriptor
        shell: bash
        run: |
          version="$(cat APEXTX_VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APEXTX_VERSION $version" >&2
            exit 1
          fi
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/nb4-generate-qualified-profile.py \
            --check docs/nb4/rf/qualification.json

      - name: Configure the firmware and the native tests
        run: |
          cmake -S . -B build/nb4-release \
            -DPCB=PL18 -DPCBREV=NB4 ${{ matrix.options }} \
            -DNB4_RF_PROFILE=RECOVERED_USART6 \
            -DAPEXTX_PUBLIC_RELEASE=ON \
            -DTRANSLATIONS=EN \
            -DDISABLE_COMPANION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DWARNINGS_AS_ERRORS=NO \
            -Wno-dev

      - name: Build and verify firmware
        run: |
          cmake --build build/nb4-release --target arm-none-eabi-configure -j4
          cmake --build build/nb4-release/arm-none-eabi --target firmware-size -j4

      - name: Verify ROM automatic-start machine code
        run: |
          python3 -m pip install --target build/rom-start-test-deps unicorn==2.1.4
          PYTHONPATH=build/rom-start-test-deps python3 tools/nb4-verify-rom-start.py \
            build/nb4-release/arm-none-eabi/firmware.bin

      - name: Build and run native tests
        run: |
          cmake --build build/nb4-release --target native-configure -j4
          cmake --build build/nb4-release/native --target gtests-radio -j4
          build/nb4-release/native/gtests-radio \
            --gtest_output=xml:build/nb4-release/native/tests.xml

      - name: Create the package archives
        shell: bash
        run: |
          version="$(cat APEXTX_VERSION)"
          package="apextx-${{ matrix.model }}-$version"
          mkdir -p dist
          # --model makes the packager refuse an image built for another radio.
          python3 tools/nb4-package.py \
            --build build/nb4-release/arm-none-eabi \
            --output "dist/$package" \
            --tests build/nb4-release/native/tests.xml \
            --release "$version" \
            --model ${{ matrix.model }}
          # Expose the exact validated image as a direct download as well.
          cp "dist/$package/firmware.bin" "dist/$package.bin"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          python3 - "$package" <<'PY'
          import shutil
          import sys
          package = sys.argv[1]
          shutil.make_archive(f"dist/{package}", "zip", "dist", package)
          PY

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: apextx-firmware-${{ matrix.model }}
          path: |
            dist/*.bin
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Attest the package archives
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.bin
            dist/*.tar.gz
            dist/*.zip

  flashers:
    name: Build the desktop flashers
    uses: ./.github/workflows/flasher.yml

  audio:
    # The voice packs install on the radio's storage and do not depend on
    # which radio it is, so they are built once rather than per model.
    name: Build the audio packs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.12
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare the pinned NB4 audio source
        shell: bash
        run: |
          # The pinned EdgeTX build image currently carries an expired Kitware
          # apt source key. Disable only that third-party source before
          # installing the audio converter.
          for source in /etc/apt/sources.list.d/*; do
            if [[ -f "$source" ]] && grep -q 'apt\.kitware\.com' "$source"; then
              mv "$source" "$source.disabled"
            fi
          done
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
          git clone --depth 1 --branch v2.12.3 --filter=blob:none --sparse \
            https://github.com/EdgeTX/edgetx-sdcard-sounds.git \
            build/edgetx-sdcard-sounds
          git -C build/edgetx-sdcard-sounds sparse-checkout set \
            SOUNDS/en SOUNDS/es SOUNDS/de voices
          test "$(git -C build/edgetx-sdcard-sounds rev-parse HEAD)" = \
            4e34b6cb40ab53c6dcd293e2b1344b54d912d41c

      - name: Create the audio packs
        shell: bash
        run: |
          mkdir -p dist
          python3 tools/nb4-audio-packs.py \
            --source build/edgetx-sdcard-sounds \
            --output dist \
            --release "$(cat APEXTX_VERSION)"

      - name: Upload the audio packs
        uses: actions/upload-artifact@v7
        with:
          name: apextx-audio
          path: dist/*.zip
          if-no-files-found: error

      - name: Attest the audio packs
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.zip

  publish:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: [firmware, audio, flashers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apextx-*
          merge-multiple: true
          path: dist

      - name: Attest the desktop flashers
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
            dist/ApexTX-Flasher-macOS-*.zip

      - name: Record checksums
        working-directory: dist
        run: sha256sum *.bin *.tar.gz *.zip *.exe > SHA256SUMS

      - name: Verify all radio and desktop downloads are present
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in \
            "apextx-nb4-$version.bin" \
            "apextx-nb4plus-$version.bin" \
            ApexTX-Flasher.exe \
            ApexTX-Flasher-macOS-arm64.zip \
            ApexTX-Flasher-macOS-x86_64.zip; do
            test -s "dist/$file" || { echo "Missing release download: $file" >&2; exit 1; }
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A semantic pre-release version carries a hyphen. Mark those as
          # pre-releases so an alpha is never presented as the latest build
          # someone should install.
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease);; esac
          cat > release-notes.md <<EOF
          ## Choose your radio

          | Radio | Direct firmware binary | Full package |
          | --- | --- | --- |
          | Original Noble NB4 | \`apextx-nb4-$version.bin\` | \`apextx-nb4-$version.zip\` |
          | Noble NB4+ | \`apextx-nb4plus-$version.bin\` | \`apextx-nb4plus-$version.zip\` |

          Choose the binary for your radio in the flasher. Full packages also
          include resources, licenses, and build/validation metadata.

          ## Download ApexTX Flasher

          | Computer | Application |
          | --- | --- |
          | Windows | \`ApexTX-Flasher.exe\` |
          | Mac with Apple Silicon | \`ApexTX-Flasher-macOS-arm64.zip\` |
          | Mac with Intel | \`ApexTX-Flasher-macOS-x86_64.zip\` |

          Mac archives contain \`ApexTX-Flasher.app\`. The apps include their
          USB tools and do not require a separate Python installation. The
          macOS apps are not Developer ID-signed or notarized by Apple.
          \`SHA256SUMS\` includes all firmware binaries, application downloads,
          firmware packages and audio packs.

          **Never install one model's package on the other model.** The updater
          and bootloader also refuse a mismatch. NB4 Pro and NB4 Pro+ are not
          supported.

          The NB4+ build is experimental. Installation and update have been
          verified on real NB4+ hardware, but the first status LED can still
          flicker red; see issue #19. Voice packs are shared by both radios.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ApexTX $version" \
            --notes-file release-notes.md \
            --generate-notes "${prerelease[@]}"
