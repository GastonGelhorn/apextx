# SPDX-License-Identifier: GPL-2.0-only
name: ApexTX Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build qualified ApexTX package for Noble NB4
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    container:
      image: ghcr.io/edgetx/edgetx-dev:2.12
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate version and release evidence
        shell: bash
        run: |
          version="$(cat APEXTX_VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match APEXTX_VERSION $version" >&2
            exit 1
          fi
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/nb4-generate-qualified-profile.py \
            --check docs/nb4/rf/qualification.json

      - name: Configure qualified firmware and native tests
        run: |
          cmake -S . -B build/nb4-release \
            -DPCB=PL18 -DPCBREV=NB4 \
            -DNB4_RF_PROFILE=QUALIFIED \
            -DAPEXTX_PUBLIC_RELEASE=ON \
            -DTRANSLATIONS=EN \
            -DDISABLE_COMPANION=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DWARNINGS_AS_ERRORS=NO \
            -Wno-dev

      - name: Build and verify firmware
        run: |
          cmake --build build/nb4-release --target arm-none-eabi-configure -j4
          cmake --build build/nb4-release/arm-none-eabi --target firmware-size -j4

      - name: Build and run native tests
        run: |
          cmake --build build/nb4-release --target native-configure -j4
          cmake --build build/nb4-release/native --target gtests-radio -j4
          build/nb4-release/native/gtests-radio \
            --gtest_output=xml:build/nb4-release/native/tests.xml

      - name: Create release archives and checksums
        shell: bash
        run: |
          version="$(cat APEXTX_VERSION)"
          mkdir -p dist
          python3 tools/nb4-package.py \
            --build build/nb4-release/arm-none-eabi \
            --output "dist/apextx-$version" \
            --tests build/nb4-release/native/tests.xml \
            --release "$version"
          tar -C dist -czf "dist/apextx-$version.tar.gz" \
            "apextx-$version"
          python3 - "$version" <<'PY'
          import shutil
          import sys
          version = sys.argv[1]
          shutil.make_archive(
              f"dist/apextx-{version}", "zip", "dist",
              f"apextx-{version}")
          PY
          cd dist
          sha256sum "apextx-$version.tar.gz" \
            "apextx-$version.zip" > SHA256SUMS

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: apextx-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attest release archives
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v5
        with:
          name: apextx-release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "ApexTX ${GITHUB_REF_NAME#v}" \
            --generate-notes
