# SPDX-License-Identifier: GPL-2.0-only
name: Release ApexTX Flasher

on:
  push:
    tags: ['flasher-v*']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-updater.txt
      - name: Validate app tag and update tests
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "flasher-v$(cat FLASHER_VERSION)"
          python -m unittest tools.tests.test_flasher_app_update tools.tests.test_flasher_app_installer
          node tools/tests/flasher_ui.cjs
  packages:
    needs: validate
    uses: ./.github/workflows/flasher.yml
  publish:
    needs: packages
    runs-on: ubuntu-latest
    # Configure this environment's approval policy before the first release.
    # PR jobs never receive the private signing key.
    environment: flasher-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r tools/requirements-updater.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: apextx-*-flasher
          merge-multiple: true
          path: dist
      - name: Authenticate all desktop packages
        env:
          APEXTX_FLASHER_SIGNING_KEY: ${{ secrets.APEXTX_FLASHER_SIGNING_KEY }}
        run: python tools/flasher-release.py --notes docs/nb4/FLASHER_RELEASE_NOTES.md
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/ApexTX-Flasher-*-windows-*.exe
            dist/ApexTX-Flasher-*-macos-*.zip
            dist/apextx-flasher.update.json
      - name: Record checksums
        working-directory: dist
        run: sha256sum ApexTX-Flasher-*-windows-*.exe ApexTX-Flasher-*-macos-*.zip > SHA256SUMS
      - name: Create complete immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat FLASHER_VERSION)"
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "ApexTX Flasher $version" --notes-file docs/nb4/FLASHER_RELEASE_NOTES.md \
            "${prerelease[@]}"
          gh release upload "$GITHUB_REF_NAME" \
            dist/ApexTX-Flasher-*-windows-*.exe dist/ApexTX-Flasher-*-macos-*.zip \
            dist/apextx-flasher.update.json dist/apextx-flasher.update.json.sig dist/SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
