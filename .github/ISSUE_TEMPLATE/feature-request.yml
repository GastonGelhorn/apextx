name: Feature request
description: Suggest an improvement for ApexTX
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the driving, setup, or maintenance task that should be easier.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how the feature should work on the transmitter.
    validations:
      required: true
  - type: textarea
    id: controls
    attributes:
      label: Controls and interface
      description: Explain which screen, button, switch, wheel, trigger, or receiver data is involved.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues for a similar request.
          required: true
