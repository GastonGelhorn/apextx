name: Bug report
description: Report a reproducible problem on the original Noble NB4
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please report only issues reproduced with ApexTX on the original FlySky Noble NB4. General EdgeTX issues belong in the upstream EdgeTX repository.
  - type: input
    id: revision
    attributes:
      label: Firmware revision
      description: Enter the release name or Git commit shown on the Version page.
      placeholder: b3762f393
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Steering or throttle
        - User interface
        - AFHDS3 or receiver binding
        - Telemetry
        - USB or storage
        - Audio, power, or charging
        - Build or flashing tools
        - Other
    validations:
      required: true
  - type: input
    id: receiver
    attributes:
      label: Receiver
      description: Enter the receiver model when the problem involves RF or telemetry.
      placeholder: Enter the exact AFHDS3 receiver model
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Power on the transmitter.
        2. Open ...
        3. Move ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add logs, photos, videos, configuration details, or USB mode when relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this on the original Noble NB4 with an unmodified ApexTX build.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
        - label: I removed serial numbers, OTP, calibration, factory dumps, credentials, and personal data.
          required: true
